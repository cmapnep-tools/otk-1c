# Выпуск по тегу vX.Y.Z на коммите master: сборка → PyPI (trusted publishing, окружение pypi) → GitHub Release
# с заметками по меткам PR (.github/release.yml). Версия в pyproject.toml и раздел CHANGELOG должны совпасть с тегом.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: version
        shell: python
        run: |
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          if version != tag:
              sys.exit(f"тег v{tag}, а в pyproject.toml версия {version}")
          if f"## [{tag}]" not in changelog:
              sys.exit(f"в CHANGELOG.md нет раздела [{tag}]")
      - name: build
        run: |
          pip install build==1.3.0
          python docs/.site/pypi_readme.py   # README для PyPI: абсолютные ссылки
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "ОТК ${GITHUB_REF_NAME#v}"
