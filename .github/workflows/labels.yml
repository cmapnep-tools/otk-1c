# Метки репозитория по .github/labels.yml: при изменении списка в master и вручную.
name: labels

on:
  push:
    branches: [master]
    paths: [.github/labels.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: crazy-max/ghaction-github-labeler@v6
        with:
          yaml-file: .github/labels.yml
